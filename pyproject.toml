[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-guohua"
version = "0.1.0"
description = "Multi-Agent Reasoning for Traditional Chinese Painting Synthesis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "diffusers==0.30.3",
    "transformers>=4.44.0,<4.47",
    "accelerate>=0.34.0",
    "peft>=0.12.0",
    "safetensors>=0.4.4",
    "openai>=1.42.0",
    "pydantic>=2.8.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "Pillow>=10.3.0",
    "shapely>=2.0.5",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "open-clip-torch>=2.26.0",
    "torchmetrics[image]>=1.4.0",
    "imagehash>=4.3.1",
    "krippendorff>=0.8.0"
]

[project.scripts]
mac-guohua = "mac_guohua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]